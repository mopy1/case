spring.application.name=case-backend

# Configuracion por defecto (si se corre localmente fuera de Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/case_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lmc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:case_password123}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# CORS (frontend React se define mas adelante)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (clave de desarrollo por defecto; en produccion se sobreescribe con JWT_SECRET)
jwt.secret=${JWT_SECRET:U3dDYXNlVG9vbERldkpXVFNlY3JldEtleTIwMjZQYXJjaWFsMQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8081}
