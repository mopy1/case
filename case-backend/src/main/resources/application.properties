spring.application.name=case-backend

# Fuera de Docker (./mvnw spring-boot:run desde case-backend/) lee el .env de la raiz del repo
# para tomar POSTGRES_PASSWORD; en Docker el archivo no existe y mandan las variables del compose.
spring.config.import=optional:file:../.env[.properties]

# Por defecto apunta al Postgres de docker-compose.yml (case_postgres en el puerto 5434)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/case_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:case_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# CORS (frontend React se define mas adelante)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (clave de desarrollo por defecto; en produccion se sobreescribe con JWT_SECRET)
jwt.secret=${JWT_SECRET:U3dDYXNlVG9vbERldkpXVFNlY3JldEtleTIwMjZQYXJjaWFsMQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8081}
