spring.application.name=case-backend

# Fuera de Docker (./mvnw spring-boot:run desde case-backend/) lee el .env de la raiz del repo
# para tomar POSTGRES_PASSWORD; en Docker el archivo no existe y mandan las variables del compose.
spring.config.import=optional:file:../.env[.properties]

# Por defecto apunta al Postgres de docker-compose.yml (case_postgres en el puerto 5434)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/case_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:case_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Sin Open Session In View: con OSIV la conexión JDBC queda tomada toda la petición, también durante
# las llamadas a DeepSeek/Gemini del Copilot (hasta ~90 s) y 10 consultas agotaban el pool de Hikari.
# Los services son @Transactional y los repos usan @EntityGraph, así que no hay carga lazy en controllers.
spring.jpa.open-in-view=false

# CORS (frontend React se define mas adelante)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (clave de desarrollo por defecto; en produccion se sobreescribe con JWT_SECRET)
jwt.secret=${JWT_SECRET:U3dDYXNlVG9vbERldkpXVFNlY3JldEtleTIwMjZQYXJjaWFsMQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8081}

# ===================================================================
# DeepSeek API (Senior Dev Chat)
# ===================================================================
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
deepseek.timeout-ms=${DEEPSEEK_TIMEOUT_MS:45000}

# ===================================================================
# Google Gemini (Copilot: reconocer fotos de diagramas). La clave va en el header x-goog-api-key.
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.models=${GEMINI_MODELS:gemini-3.5-flash-lite,gemini-3.5-flash,gemini-2.0-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}
